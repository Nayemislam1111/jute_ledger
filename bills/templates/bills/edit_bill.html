{% extends 'bills/base.html' %}
{% block content %}
<div class="p-8 bg-white border-b">
    <h2 class="text-2xl font-bold text-gray-800">Edit Bill Entry</h2>
</div>
<div class="p-8 max-w-4xl">
    
    <div class="bg-white p-6 rounded-2xl border shadow-sm">
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div class="grid grid-cols-3 gap-4">
                <div><label class="text-xs font-bold text-gray-400 block mb-1">LOT NO</label><input type="text" name="lot_no" value="{{ bill.lot_no }}" required class="w-full border rounded-xl px-3 py-2 text-sm"></div>
                <div><label class="text-xs font-bold text-gray-400 block mb-1">ID NO</label><input type="text" name="id_no" value="{{ bill.id_no }}" required class="w-full border rounded-xl px-3 py-2 text-sm"></div>
                <div><label class="text-xs font-bold text-gray-400 block mb-1">AREA</label><input type="text" name="area" value="{{ bill.area }}" required class="w-full border rounded-xl px-3 py-2 text-sm"></div>
            </div>
            <div class="grid grid-cols-3 gap-4">
                <div><label class="text-xs font-bold text-gray-400 block mb-1">NAME</label><input type="text" name="name" value="{{ bill.name }}" required class="w-full border rounded-xl px-3 py-2 text-sm"></div>
                <div><label class="text-xs font-bold text-gray-400 block mb-1">JUTE (MON)</label><input type="number" step="0.01" name="jute_mon" value="{{ bill.jute_mon }}" required class="w-full border rounded-xl px-3 py-2 text-sm"></div>
                <div><label class="text-xs font-bold text-gray-400 block mb-1">RATE</label><input type="number" step="0.01" name="rate" value="{{ bill.rate }}" required class="w-full border rounded-xl px-3 py-2 text-sm"></div>
            </div>

            <div class="flex justify-between border-t pt-4">
                <a href="{% url 'bill_entry' %}" class="bg-gray-100 text-gray-700 px-6 py-2.5 rounded-xl font-bold text-sm hover:bg-gray-200 transition">Cancel</a>
                <button type="submit" class="bg-[#B58A4A] text-white px-6 py-2.5 rounded-xl font-bold text-sm">Update Bill</button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
